<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>flowers for you 🌹</title>
<style>
  /* ————————————————————————————————————————————————
     a bouquet, coded by hand
     palette lifted from the inked-bouquet reference:
     cream petals, sepia ink, carnation red, leaf green
     ———————————————————————————————————————————————— */
  :root{
    --bg-0:#160f13;
    --bg-1:#241318;
    --glow:#4a2228;
    --cream:#f6ecd4;
    --cream-2:#efe0ba;
    --guard:#e9e4b0;
    --ink:#8a6844;
    --ink-deep:#6b4f33;
    --red:#d31e2e;
    --red-deep:#a5121f;
    --red-ink:#5c0710;
    --leaf:#2e8b47;
    --leaf-deep:#1f6b36;
    --leaf-ink:#14472a;
    --gold:#f3d48a;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    background:
      radial-gradient(120vmax 80vmax at 50% 115%, var(--glow) 0%, transparent 55%),
      radial-gradient(90vmax 90vmax at 50% -20%, #201220 0%, transparent 60%),
      linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 100%);
    background-color:var(--bg-0);
    color:var(--cream);
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    overflow:hidden;
  }

  .scene{ position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; }

  @keyframes rise{ from{ opacity:0; transform:translateY(16px); } to{ opacity:1; transform:none; } }

  /* ——— sun & moon ——— */
  .celestial{
    position:absolute; z-index:2; overflow:visible; pointer-events:none;
    opacity:0; animation:dawn 2.6s ease both;
  }
  #sun{ left:8%; top:17%; width:clamp(64px,11vmin,110px); height:clamp(64px,11vmin,110px); animation-delay:.7s; }
  #moon{ right:8%; top:11%; width:clamp(56px,9.5vmin,96px); height:clamp(56px,9.5vmin,96px); animation-delay:1.3s; }
  @keyframes dawn{ from{ opacity:0; transform:translateY(12px); } to{ opacity:1; transform:none; } }
  .sun-rays{
    transform-box:fill-box; transform-origin:50% 50%;
    animation:turn 240s linear infinite;
  }
  @keyframes turn{ to{ transform:rotate(360deg); } }

  /* ——— the sun's constellation, hung between them ——— */
  #zodiac{
    position:absolute; z-index:1; pointer-events:none; overflow:visible;
    /* centred with auto margins, not a transform — the fade-in animation
       animates transform, and would otherwise cancel the centring */
    left:0; right:0; margin-inline:auto; top:9%;
    width:clamp(190px,26vw,340px); height:clamp(90px,15vh,150px);
    opacity:0; animation:dawn 3.4s ease 2.1s both;
  }
  .con-line{ stroke:var(--ink); stroke-width:.9; opacity:.34; stroke-linecap:round; }
  .con-star{
    fill:#fdf4dd;
    animation:shimmer var(--dur,4s) ease-in-out var(--d,0s) infinite alternate;
  }
  @keyframes shimmer{ from{ opacity:.45; } to{ opacity:1; } }
  .moon-glyph{
    fill:var(--cream); opacity:.42;
    font-family:"Iowan Old Style",Georgia,serif; font-size:19px; text-anchor:middle;
  }

  /* ——— the garden ——— */
  #garden{
    position:absolute; bottom:0; left:50%; transform:translateX(-50%);
    height:min(88vh,1000px); width:auto; max-width:none;
    overflow:visible;
  }

  .blade{
    transform-box:fill-box; transform-origin:50% 100%;
    animation:sprout .9s cubic-bezier(.3,1.4,.5,1) both;
    animation-delay:var(--d);
  }
  @keyframes sprout{ from{ transform:scaleY(0) scaleX(.6); } to{ transform:none; } }

  .stem{
    fill:none; stroke-linecap:round;
    stroke-dasharray:1; stroke-dashoffset:1;
    animation:draw var(--dur,1.4s) ease-in-out both;
    animation-delay:var(--d);
  }
  @keyframes draw{ to{ stroke-dashoffset:0; } }

  .leaf{
    transform-box:fill-box; transform-origin:50% 100%;
    animation:unfold .8s cubic-bezier(.34,1.6,.64,1) both;
    animation-delay:var(--d);
  }
  @keyframes unfold{
    from{ transform:scale(0) rotate(-24deg); }
    70%{ transform:scale(1.12) rotate(5deg); }
    to{ transform:none; }
  }

  .ring{
    transform-box:fill-box; transform-origin:50% 50%;
    animation:blossom 1s cubic-bezier(.34,1.45,.64,1) both;
    animation-delay:var(--d);
  }
  @keyframes blossom{
    from{ transform:scale(.04) rotate(var(--twist,-45deg)); opacity:0; }
    45%{ opacity:1; }
    70%{ transform:scale(1.07) rotate(calc(var(--twist,-45deg) * -.12)); }
    to{ transform:none; opacity:1; }
  }

  .head{
    transform-box:fill-box; transform-origin:50% 50%;
    animation:sway 7s ease-in-out infinite alternate;
    animation-delay:var(--sway,0s);
  }
  @keyframes sway{ from{ transform:rotate(-1.6deg); } to{ transform:rotate(1.8deg); } }

  /* ——— sparkles & stars ——— */
  .star{
    position:absolute; border-radius:50%;
    background:var(--c,#fff);
    box-shadow:0 0 6px var(--c,#fff);
    animation:twinkle var(--dur) ease-in-out var(--d) infinite alternate;
    opacity:0;
  }
  @keyframes twinkle{ from{ opacity:.05; } to{ opacity:var(--o,.7); } }

  .spark{
    position:absolute; border-radius:50%;
    background:var(--c); box-shadow:0 0 10px var(--c), 0 0 22px var(--c);
    opacity:0;
    animation:drift var(--dur) ease-in-out var(--d) infinite;
  }
  @keyframes drift{
    0%{ opacity:0; transform:translateY(14px) scale(.4); }
    25%{ opacity:.9; }
    100%{ opacity:0; transform:translateY(-90px) translateX(var(--wander,8px)) scale(1); }
  }

  /* ——— replay ——— */
  #replay{
    position:absolute; bottom:22px; right:24px; z-index:9;
    font-family:ui-sans-serif,system-ui,sans-serif;
    font-size:11px; letter-spacing:.28em; text-transform:uppercase;
    color:#cdaea0; background:transparent;
    border:1px solid rgba(205,174,160,.35); border-radius:999px;
    padding:10px 18px; cursor:pointer;
    opacity:0; animation:rise 1.2s ease 6s both;
    transition:color .3s, border-color .3s, box-shadow .3s;
  }
  #replay:hover, #replay:focus-visible{
    color:var(--cream); border-color:rgba(246,236,212,.7);
    box-shadow:0 0 16px rgba(243,212,138,.2);
    outline:none;
  }

  @media (max-width:700px){
    #garden{ width:152vw; height:auto; max-height:72vh; }
    #sun{ left:9%; top:9%; }
    #moon{ right:9%; top:6%; }
    #replay{ right:50%; transform:translateX(50%); background:rgba(22,15,19,.65); }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.01s !important; animation-delay:0s !important; animation-iteration-count:1 !important; }
    .spark{ display:none; }
  }
</style>
</head>
<body>
<div class="scene" id="scene">
  <svg id="sun" class="celestial" viewBox="-60 -60 120 120" aria-label="The sun"></svg>
  <svg id="moon" class="celestial" viewBox="-60 -60 120 120"></svg>
  <svg id="zodiac" viewBox="0 0 340 150"></svg>
  <svg id="garden" viewBox="0 0 1000 820" aria-label="A bouquet of cream roses and red carnations blossoming"></svg>
  <button id="replay" type="button">bloom again</button>
</div>

<script>
const SVG = "http://www.w3.org/2000/svg";
const rand = (a, b) => a + Math.random() * (b - a);

function el(name, attrs, parent){
  const n = document.createElementNS(SVG, name);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}

/* one rose petal, base at origin, pointing up */
function petalPath(w, h){
  const dip = h * rand(0.92, 0.98);
  return `M0 0
    C ${-w*0.55} ${-h*0.08}, ${-w*1.02} ${-h*0.42}, ${-w*0.82} ${-h*0.78}
    Q ${-w*0.52} ${-h*1.06}, 0 ${-dip}
    Q ${w*0.52} ${-h*1.06}, ${w*0.82} ${-h*0.78}
    C ${w*1.02} ${-h*0.42}, ${w*0.55} ${-h*0.08}, 0 0 Z`;
}

/* ring of petals around origin */
function petalRing(parent, { count, w, h, fill, stroke, sw, offset = 0, delay, twist, detail }){
  const ring = el("g", { class:"ring" }, parent);
  ring.style.setProperty("--d", delay + "s");
  ring.style.setProperty("--twist", twist + "deg");
  for (let i = 0; i < count; i++){
    const a = offset + (360 / count) * i + rand(-4, 4);
    const g = el("g", { transform:`rotate(${a})` }, ring);
    const pw = w * rand(0.92, 1.08), ph = h * rand(0.94, 1.06);
    el("path", { d: petalPath(pw, ph), fill, stroke, "stroke-width": sw, "stroke-linejoin":"round" }, g);
    if (detail){
      /* one soft ink vein inside the petal */
      el("path", {
        d:`M0 ${-ph*0.16} Q ${-pw*0.3} ${-ph*0.5}, ${-pw*0.12} ${-ph*0.8}`,
        fill:"none", stroke, "stroke-width": sw*0.55, opacity:0.5, "stroke-linecap":"round",
      }, g);
    }
  }
  return ring;
}

/* the inky swirl at a rose's heart */
function roseSpiral(parent, R, delay){
  const g = el("g", { class:"ring" }, parent);
  g.style.setProperty("--d", delay + "s");
  g.style.setProperty("--twist", "-120deg");
  el("circle", { r:R*0.34, fill:"var(--cream)", stroke:"var(--ink)", "stroke-width":1.6 }, g);
  let d = "", first = true;
  for (let t = 0; t <= Math.PI*5.1; t += 0.14){
    const r = 1.5 + (R*0.30 / (Math.PI*5.1)) * t;
    const x = Math.cos(t + 0.6) * r, y = Math.sin(t + 0.6) * r * 0.92;
    d += (first ? "M" : "L") + x.toFixed(1) + " " + y.toFixed(1) + " ";
    first = false;
  }
  el("path", { d, fill:"none", stroke:"var(--ink-deep)", "stroke-width":1.5, "stroke-linecap":"round", opacity:0.85 }, g);
  return g;
}

function rose(parent, x, y, R, tBloom, sway){
  const head = el("g", { transform:`translate(${x} ${y})` }, parent);
  const inner = el("g", { class:"head" }, head);
  inner.style.setProperty("--sway", sway + "s");
  /* greenish guard petals peeking out underneath */
  petalRing(inner, { count:5, w:R*0.44, h:R*1.12, fill:"var(--guard)", stroke:"var(--ink)", sw:1.8, offset:36, delay:tBloom, twist:-50 });
  petalRing(inner, { count:6, w:R*0.42, h:R*0.95, fill:"var(--cream)", stroke:"var(--ink)", sw:1.8, offset:0,  delay:tBloom+0.22, twist:40, detail:true });
  petalRing(inner, { count:5, w:R*0.36, h:R*0.68, fill:"var(--cream-2)", stroke:"var(--ink)", sw:1.7, offset:52, delay:tBloom+0.44, twist:-38, detail:true });
  petalRing(inner, { count:4, w:R*0.30, h:R*0.44, fill:"var(--cream)", stroke:"var(--ink)", sw:1.6, offset:20, delay:tBloom+0.64, twist:34 });
  roseSpiral(inner, R, tBloom + 0.84);
}

/* jagged ruffle disc for carnations */
function rufflePath(R, spikes){
  let d = "";
  for (let i = 0; i <= spikes * 2; i++){
    const a = (Math.PI * 2 * i) / (spikes * 2) - Math.PI / 2;
    const r = (i % 2 === 0 ? R : R * 0.87) * rand(0.96, 1.04);
    d += (i === 0 ? "M" : "L") + (Math.cos(a)*r).toFixed(1) + " " + (Math.sin(a)*r).toFixed(1) + " ";
  }
  return d + "Z";
}

function carnation(parent, x, y, R, tBloom, sway){
  const head = el("g", { transform:`translate(${x} ${y})` }, parent);
  const inner = el("g", { class:"head" }, head);
  inner.style.setProperty("--sway", sway + "s");
  const layers = [
    { r:R,       fill:"var(--red-deep)", twist:-55, spikes:30 },
    { r:R*0.82,  fill:"var(--red)",      twist:45,  spikes:26 },
    { r:R*0.62,  fill:"#e0303c",         twist:-40, spikes:22 },
    { r:R*0.42,  fill:"var(--red)",      twist:35,  spikes:16 },
    { r:R*0.24,  fill:"#e8404b",         twist:-45, spikes:11 },
  ];
  layers.forEach((L, i) => {
    const ring = el("g", { class:"ring" }, inner);
    ring.style.setProperty("--d", (tBloom + i * 0.16) + "s");
    ring.style.setProperty("--twist", L.twist + "deg");
    el("path", {
      d: rufflePath(L.r, L.spikes),
      fill: L.fill, stroke:"var(--red-ink)", "stroke-width":1.4, "stroke-linejoin":"round",
      transform:`rotate(${rand(0,360)})`,
    }, ring);
  });
  /* short ink flecks at the heart */
  const flecks = el("g", { class:"ring" }, inner);
  flecks.style.setProperty("--d", (tBloom + 0.85) + "s");
  flecks.style.setProperty("--twist", "60deg");
  for (let i = 0; i < 7; i++){
    const a = rand(0, Math.PI*2), r1 = R*0.06, r2 = R*rand(0.16, 0.26);
    el("line", {
      x1:Math.cos(a)*r1, y1:Math.sin(a)*r1, x2:Math.cos(a)*r2, y2:Math.sin(a)*r2,
      stroke:"var(--red-ink)", "stroke-width":1.6, "stroke-linecap":"round", opacity:0.8,
    }, flecks);
  }
}

/* pointed leaf, base at origin, pointing up */
function leaf(parent, x, y, angle, size, delay){
  const g = el("g", { transform:`translate(${x} ${y}) rotate(${angle})` }, parent);
  const inner = el("g", { class:"leaf" }, g);
  inner.style.setProperty("--d", delay + "s");
  const w = size * 0.36, h = size;
  el("path", {
    d:`M0 0 Q ${-w} ${-h*0.42}, 0 ${-h} Q ${w} ${-h*0.42}, 0 0 Z`,
    fill:"var(--leaf)", stroke:"var(--leaf-ink)", "stroke-width":1.6, "stroke-linejoin":"round",
  }, inner);
  el("path", { d:`M0 ${-h*0.08} L0 ${-h*0.9}`, stroke:"var(--leaf-ink)", "stroke-width":1.1, opacity:0.65 }, inner);
}

function blade(parent, x, h, lean, delay, color){
  const b = el("path", {
    class:"blade",
    d:`M${x} 800 Q ${x + lean*0.3} ${800 - h*0.6}, ${x + lean} ${800 - h} Q ${x + lean*0.55} ${800 - h*0.55}, ${x + 7} 800 Z`,
    fill: color,
  }, parent);
  b.style.setProperty("--d", delay + "s");
}

function stem(parent, x0, x1, y1, bend, delay, dur){
  const midX = (x0 + x1) / 2 + bend;
  const p = el("path", {
    class:"stem",
    d:`M${x0} 805 C ${x0 + bend*0.4} 700, ${midX} ${(805 + y1)/2}, ${x1} ${y1}`,
    stroke:"var(--leaf-deep)", "stroke-width":7, pathLength:1,
  }, parent);
  p.style.setProperty("--d", delay + "s");
  p.style.setProperty("--dur", dur + "s");
  return p;
}

/* leaves sprinkled along a stem, timed to when the drawing tip passes */
function leavesAlong(parent, stemEl, delay, dur, spots){
  const len = stemEl.getTotalLength();
  spots.forEach(([t, side, size]) => {
    const pt = stemEl.getPointAtLength(len * t);
    const ahead = stemEl.getPointAtLength(Math.min(len, len * t + 2));
    const tangent = Math.atan2(ahead.y - pt.y, ahead.x - pt.x) * 180 / Math.PI;
    leaf(parent, pt.x, pt.y, tangent + 90 + side * rand(38, 55), size, delay + dur * t + 0.1);
  });
}

const FLOWERS = [
  /* kind, base-x, head-x, head-y, size, bend, order */
  { kind:"rose",      x0:500, x1:495, y1:300, R:88, bend:-14, leaves:[[0.42,-1,64],[0.62,1,58]] },
  { kind:"rose",      x0:415, x1:330, y1:410, R:74, bend:-46, leaves:[[0.5,1,56],[0.7,-1,48]] },
  { kind:"rose",      x0:585, x1:665, y1:395, R:76, bend:44,  leaves:[[0.45,-1,58],[0.68,1,50]] },
  { kind:"carnation", x0:455, x1:405, y1:245, R:56, bend:-20, leaves:[[0.55,1,50]] },
  { kind:"carnation", x0:545, x1:590, y1:250, R:52, bend:26,  leaves:[[0.5,-1,52],[0.72,1,44]] },
  { kind:"carnation", x0:370, x1:250, y1:540, R:58, bend:-40, leaves:[[0.6,-1,48]] },
  { kind:"carnation", x0:630, x1:745, y1:520, R:55, bend:42,  leaves:[[0.58,1,48]] },
];

function buildGarden(){
  const svg = document.getElementById("garden");
  svg.textContent = "";

  /* soft pooled shadow under the bouquet */
  el("ellipse", { cx:500, cy:800, rx:290, ry:26, fill:"#000", opacity:0.35 }, svg);

  /* grass skirt */
  const grass = el("g", {}, svg);
  for (let i = 0; i < 26; i++){
    const x = 190 + i * 24 + rand(-9, 9);
    const dist = Math.abs(x - 500) / 310;
    blade(grass, x, rand(70, 190) * (1.15 - dist * 0.55), rand(-45, 45), rand(0, 0.7),
      i % 3 ? "var(--leaf-deep)" : "#256d3a");
  }

  const stems = el("g", {}, svg);
  const leavesG = el("g", {}, svg);
  const heads = el("g", {}, svg);

  FLOWERS.forEach((f, i) => {
    const delay = 0.35 + i * 0.22;
    const dur = 1.5;
    const s = stem(stems, f.x0, f.x1, f.y1, f.bend, delay, dur);
    leavesAlong(leavesG, s, delay, dur, f.leaves);
    const tBloom = delay + dur * 0.92;
    const sway = -rand(0, 4);
    if (f.kind === "rose") rose(heads, f.x1, f.y1, f.R, tBloom, sway);
    else carnation(heads, f.x1, f.y1, f.R, tBloom, sway);
  });
}

/* ——— an inked sun ——— */
function buildSun(){
  const svg = document.getElementById("sun");
  svg.textContent = "";
  const glow = el("radialGradient", { id:"sunglow" }, el("defs", {}, svg));
  el("stop", { offset:"0%",  "stop-color":"#f3d48a", "stop-opacity":.35 }, glow);
  el("stop", { offset:"100%","stop-color":"#f3d48a", "stop-opacity":0 }, glow);
  el("circle", { r:58, fill:"url(#sunglow)" }, svg);
  /* woodcut rays, alternating long and short */
  const rays = el("g", { class:"sun-rays" }, svg);
  for (let i = 0; i < 12; i++){
    const a = (Math.PI * 2 * i) / 12;
    const r2 = i % 2 ? 40 : 47;
    el("line", {
      x1:Math.cos(a)*33, y1:Math.sin(a)*33, x2:Math.cos(a)*r2, y2:Math.sin(a)*r2,
      stroke:"var(--gold)", "stroke-width":2.6, "stroke-linecap":"round", opacity:.85,
    }, rays);
  }
  el("circle", { r:26, fill:"#f0cd7e", stroke:"var(--ink)", "stroke-width":1.8 }, svg);
  /* cel-shade crescent along the lower-left of the disc */
  el("path", { d:"M -20 14 A 26 26 0 0 0 12 22 A 21 21 0 0 1 -20 14 Z",
    fill:"var(--ink)", opacity:.18 }, svg);
}

/* ═══════════ the zodiac ═══════════
   Real stars: [right ascension in hours, declination in degrees, magnitude].
   `lines` joins them by index into the shape people actually trace. */
const ZODIAC = [
  { name:"Aries", glyph:"♈", stars:[[1.892,19.29,3.9],[1.911,20.81,2.6],[2.119,23.46,2.0],[2.833,27.26,3.6]],
    lines:[[0,1],[1,2],[2,3]] },
  { name:"Taurus", glyph:"♉", stars:[[4.599,16.51,0.9],[5.438,28.61,1.7],[3.791,24.11,2.9],[4.477,15.87,3.4],[4.330,15.63,3.6],[4.478,19.18,3.5],[5.627,21.14,3.0],[4.011,12.49,3.4]],
    lines:[[4,3],[3,0],[5,0],[2,5],[0,6],[6,1],[7,4]] },
  { name:"Gemini", glyph:"♊", stars:[[7.755,28.03,1.1],[7.577,31.89,1.6],[6.629,16.40,1.9],[7.335,21.98,3.5],[6.732,25.13,3.0],[6.383,22.51,2.9],[6.248,22.51,3.3],[6.755,12.90,3.4]],
    lines:[[1,4],[0,3],[4,5],[5,6],[3,2],[3,4],[2,7]] },
  { name:"Cancer", glyph:"♋", stars:[[8.975,11.86,4.3],[8.275,9.19,3.5],[8.745,18.15,3.9],[8.722,21.47,4.7],[8.778,28.76,4.0]],
    lines:[[1,2],[2,0],[2,3],[3,4]] },
  { name:"Leo", glyph:"♌", stars:[[10.139,11.97,1.4],[11.818,14.57,2.1],[10.333,19.84,2.0],[11.235,20.52,2.6],[9.764,23.77,3.0],[11.237,15.43,3.3],[10.278,23.42,3.4],[10.123,16.76,3.5],[9.879,26.01,3.9]],
    lines:[[4,8],[8,6],[6,2],[2,7],[7,0],[0,5],[5,1],[1,3],[3,2]] },
  { name:"Virgo", glyph:"♍", stars:[[13.420,-11.16,1.0],[11.845,1.76,3.6],[12.694,-1.45,2.7],[12.926,3.40,3.4],[13.036,10.96,2.8],[13.578,-0.60,3.4],[12.332,-0.67,3.9]],
    lines:[[4,3],[3,2],[2,1],[2,5],[5,0],[2,6]] },
  { name:"Libra", glyph:"♎", stars:[[14.848,-16.04,2.8],[15.283,-9.38,2.6],[15.592,-14.79,3.9],[15.067,-25.28,3.3]],
    lines:[[0,1],[1,2],[2,0],[0,3]] },

/* Days since the J2000.0 epoch */
function daysSinceJ2000(){ return (Date.now() - Date.UTC(2000, 0, 1, 12)) / 86400000; }
const sin = d => Math.sin(d * Math.PI / 180);

/* Ecliptic longitude of the sun, good to ~0.01° */
function sunLongitude(){
  const d = daysSinceJ2000();
  const M = 357.529 + 0.98560028 * d;
  const L = 280.459 + 0.98564736 * d;
  return ((L + 1.915 * sin(M) + 0.020 * sin(2 * M)) % 360 + 360) % 360;
}

/* Ecliptic longitude of the moon, good to ~0.2° — it moves ~13°/day,
   so it changes sign every 2 or 3 days. */
function moonLongitude(){
  const d = daysSinceJ2000();
  const L = 218.316 + 13.176396 * d;      /* mean longitude */
  const M = 134.963 + 13.064993 * d;      /* mean anomaly */
  const F = 93.272 + 13.229350 * d;       /* argument of latitude */
  const D = 297.850 + 12.190749 * d;      /* mean elongation from the sun */
  const Ms = 357.529 + 0.98560028 * d;    /* the sun's mean anomaly */
  const lon = L + 6.289 * sin(M) + 1.274 * sin(2 * D - M) + 0.658 * sin(2 * D)
            + 0.214 * sin(2 * M) - 0.186 * sin(Ms) - 0.114 * sin(2 * F);
  return ((lon % 360) + 360) % 360;
}

/* Tropical signs are simply 30° slices of ecliptic longitude from the equinox */
const signOf = longitude => ZODIAC[Math.floor(longitude / 30) % 12];

/* ——— draw a constellation, auto-fitted to its box ——— */
function buildConstellation(){
  const svg = document.getElementById("zodiac");
  svg.textContent = "";
  const sign = signOf(sunLongitude());
  svg.setAttribute("aria-label", "The constellation " + sign.name + ", where the sun sits today");

  /* flat projection around the constellation's own centre */
  const raC = sign.stars[0][0];
  const decC = sign.stars.reduce((s, st) => s + st[1], 0) / sign.stars.length;
  const cosDec = Math.cos(decC * Math.PI / 180);
  const pts = sign.stars.map(([ra, dec]) => {
    let dRa = ra - raC;                        /* keep constellations that straddle 0h together */
    if (dRa > 12) dRa -= 24;
    if (dRa < -12) dRa += 24;
    return [-dRa * 15 * cosDec, -(dec - decC)];
  });

  /* fit to the viewBox with padding, preserving the true shape */
  const W = 340, H = 150, pad = 26;
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const spanX = Math.max(...xs) - Math.min(...xs) || 1;
  const spanY = Math.max(...ys) - Math.min(...ys) || 1;
  const k = Math.min((W - pad * 2) / spanX, (H - pad * 2) / spanY);
  const offX = (W - spanX * k) / 2 - Math.min(...xs) * k;
  const offY = (H - spanY * k) / 2 - Math.min(...ys) * k;
  const xy = pts.map(([x, y]) => [x * k + offX, y * k + offY]);

  sign.lines.forEach(([a, b]) => {
    el("line", { class:"con-line", x1:xy[a][0], y1:xy[a][1], x2:xy[b][0], y2:xy[b][1] }, svg);
  });
  sign.stars.forEach(([, , mag], i) => {
    const r = Math.max(1.1, 3.1 - 0.5 * (mag - 0.9));   /* brighter stars, bigger dots */
    const s = el("circle", { class:"con-star", cx:xy[i][0], cy:xy[i][1], r }, svg);
    s.style.setProperty("--d", rand(0, 4) + "s");
    s.style.setProperty("--dur", rand(2.4, 5) + "s");
    if (mag < 2.2) s.setAttribute("filter", "url(#starglow)");
  });
  const defs = el("defs", {}, svg);
  const f = el("filter", { id:"starglow", x:"-300%", y:"-300%", width:"700%", height:"700%" }, defs);
  el("feGaussianBlur", { stdDeviation:2.2, result:"b" }, f);
  const m = el("feMerge", {}, f);
  el("feMergeNode", { in:"b" }, m);
  el("feMergeNode", { in:"SourceGraphic" }, m);
}

/* ——— the moon, as it is tonight ———
   0 = new · .25 = first quarter · .5 = full · .75 = last quarter */
function moonPhase(){
  const synodic = 29.530588853;
  const newMoonRef = Date.UTC(2000, 0, 6, 18, 14);
  let p = ((Date.now() - newMoonRef) / 86400000 / synodic) % 1;
  return p < 0 ? p + 1 : p;
}
function phaseName(p){
  const names = ["new moon","waxing crescent","first quarter moon","waxing gibbous moon",
                 "full moon","waning gibbous moon","last quarter moon","waning crescent"];
  return names[Math.round(p * 8) % 8];
}
function buildMoon(){
  const svg = document.getElementById("moon");
  svg.textContent = "";
  const p = moonPhase(), R = 28;
  svg.setAttribute("aria-label", "Tonight's " + phaseName(p));
  const glow = el("radialGradient", { id:"moonglow" }, el("defs", {}, svg));
  const lit = Math.max(0.06, (1 - Math.cos(Math.PI * 2 * p)) / 2);
  el("stop", { offset:"0%",  "stop-color":"#f2e6c4", "stop-opacity":.3 * lit + .06 }, glow);
  el("stop", { offset:"100%","stop-color":"#f2e6c4", "stop-opacity":0 }, glow);
  el("circle", { r:56, fill:"url(#moonglow)" }, svg);
  /* the dark disc, faintly there, with the same sepia ink line as the flowers */
  el("circle", { r:R, fill:"#332b3a", stroke:"var(--ink)", "stroke-width":1.6, "stroke-opacity":.8 }, svg);
  /* the sunlit part: limb semicircle + elliptical terminator */
  const a = Math.cos(Math.PI * 2 * p) * R;   /* terminator half-width, signed */
  if (p > 0.98 || p < 0.02){
    /* new moon: nothing lit */
  } else if (Math.abs(p - 0.5) < 0.02){
    el("circle", { r:R, fill:"#f2e6c4" }, svg);
  } else {
    const d = `M0 ${-R} A ${R} ${R} 0 0 1 0 ${R} A ${Math.abs(a).toFixed(2)} ${R} 0 0 ${a > 0 ? 0 : 1} 0 ${-R} Z`;
    el("path", { d, fill:"#f2e6c4", transform: p < 0.5 ? "" : "scale(-1 1)" }, svg);
  }
  /* two quiet craters */
  const s = p < 0.5 ? 1 : -1;
  el("circle", { cx:s*R*0.52, cy:-R*0.18, r:R*0.12, fill:"#000", opacity:.08 }, svg);
  el("circle", { cx:s*R*0.3,  cy: R*0.34, r:R*0.09, fill:"#000", opacity:.08 }, svg);

  /* the sign the moon is travelling through right now — it crosses one
     every 2 to 3 days, so this is the fastest-moving thing on the page */
  const moonSign = signOf(moonLongitude());
  const g = el("text", { class:"moon-glyph", x:0, y:R + 22 }, svg);
  /* U+FE0E asks for the inked text form of the glyph, not a colour emoji */
  g.textContent = moonSign.glyph + "︎";
  svg.setAttribute("aria-label",
    "Tonight's " + phaseName(p) + ", travelling through " + moonSign.name);
}

function buildSky(){
  const scene = document.getElementById("scene");
  document.querySelectorAll(".star,.spark").forEach(n => n.remove());
  for (let i = 0; i < 44; i++){
    const s = document.createElement("div");
    s.className = "star";
    const size = rand(1, 2.6);
    Object.assign(s.style, {
      left: rand(0, 100) + "%", top: rand(0, 72) + "%",
      width: size + "px", height: size + "px",
    });
    s.style.setProperty("--c", Math.random() < 0.2 ? "var(--gold)" : "#e8dcd0");
    s.style.setProperty("--o", rand(0.25, 0.7));
    s.style.setProperty("--dur", rand(1.6, 4) + "s");
    s.style.setProperty("--d", rand(0, 4) + "s");
    scene.appendChild(s);
  }
  const colors = ["var(--gold)", "#e4586a", "#f6ecd4"];
  for (let i = 0; i < 22; i++){
    const p = document.createElement("div");
    p.className = "spark";
    const size = rand(2.5, 5);
    Object.assign(p.style, {
      left: rand(24, 76) + "%", bottom: rand(18, 66) + "%",
      width: size + "px", height: size + "px",
    });
    p.style.setProperty("--c", colors[i % colors.length]);
    p.style.setProperty("--dur", rand(3.5, 6.5) + "s");
    p.style.setProperty("--d", rand(3.8, 10) + "s");
    p.style.setProperty("--wander", rand(-26, 26) + "px");
    scene.appendChild(p);
  }
}

function bloom(){
  buildGarden();
  buildSun();
  buildMoon();
  buildConstellation();
  buildSky();
  /* restart the sun & moon fade-in on replay */
  document.querySelectorAll(".celestial, #zodiac").forEach(c => {
    c.style.animation = "none"; void c.getBoundingClientRect();
    c.style.animation = "";
  });
}

document.getElementById("replay").addEventListener("click", bloom);
bloom();
</script>
