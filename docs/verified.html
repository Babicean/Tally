<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tally — email verified</title>
  <meta name="color-scheme" content="light dark" />
  <style>
    :root {
      --bg: #f5f6f8; --card: #ffffff; --ink: #1b1d22; --ink-2: #6b6e76;
      --accent: #149e60; --accent-soft: rgba(20, 158, 96, 0.1);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0c0d10; --card: #1e2126; --ink: #f4f5f7; --ink-2: #a3a7b0;
        --accent: #27a468; --accent-soft: rgba(39, 164, 104, 0.16);
      }
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      background: var(--bg); color: var(--ink); min-height: 100vh;
      display: grid; place-items: center; padding: 1.5rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      background: var(--card); border-radius: 1.25rem; max-width: 22rem;
      padding: 2.25rem 1.75rem; text-align: center;
      box-shadow: 0 8px 28px rgba(23, 26, 33, 0.07);
    }
    .tick {
      width: 3.5rem; height: 3.5rem; border-radius: 50%;
      background: var(--accent-soft); color: var(--accent);
      display: grid; place-items: center; margin: 0 auto 1.125rem;
    }
    h1 { font-size: 1.25rem; letter-spacing: -0.01em; }
    p { margin-top: 0.5rem; font-size: 0.9375rem; line-height: 1.5; color: var(--ink-2); }
    .wordmark {
      margin-top: 1.5rem; font-size: 0.75rem; font-weight: 600;
      letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-2);
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="tick" aria-hidden="true">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
        <path d="M5 12.5l4.5 4.5L19 7.5" stroke="currentColor" stroke-width="2.4"
          stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1>Email verified</h1>
    <p>You're all set. Close this tab, head back to Tally, and log in.</p>
    <div class="wordmark">Tally</div>
  </main>
</body>
</html>
