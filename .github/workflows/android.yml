name: Android APK

on:
  push:
    branches: ["main", "claude/**"]
    tags: ["v*"]
  workflow_dispatch:

# Needed so the release steps can create GitHub Releases.
permissions:
  contents: write

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The signing key lives in repository secrets, never in the repo:
      #   TALLY_KEYSTORE_BASE64   the .jks file, base64-encoded
      #   TALLY_KEYSTORE_PASSWORD, TALLY_KEY_ALIAS, TALLY_KEY_PASSWORD
      # Without them (or on pull requests from forks) CI still tests and
      # builds, but produces an unsigned debug APK and publishes nothing.
      - name: Restore signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.TALLY_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No signing key configured: building a debug APK instead."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tally-release.jks"
          echo "TALLY_KEYSTORE_FILE=$RUNNER_TEMP/tally-release.jks" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        if: steps.signing.outputs.signed == 'true'
        working-directory: android
        env:
          TALLY_KEYSTORE_PASSWORD: ${{ secrets.TALLY_KEYSTORE_PASSWORD }}
          TALLY_KEY_ALIAS: ${{ secrets.TALLY_KEY_ALIAS }}
          TALLY_KEY_PASSWORD: ${{ secrets.TALLY_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Build debug APK
        if: steps.signing.outputs.signed != 'true'
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/tally-release.jks"

      - name: Upload APK artifact
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tally-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Attach APK to release
        if: steps.signing.outputs.signed == 'true' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/app-release.apk

      # Rolling release: every signed main build refreshes the APK at a stable
      # URL (…/releases/download/latest/app-release.apk).
      - name: Update rolling 'latest' release
        if: steps.signing.outputs.signed == 'true' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Tally (latest build)
          body: |
            Signed APK from the most recent build of main. Download
            app-release.apk below and open it on your phone to install
            or update.
          files: android/app/build/outputs/apk/release/app-release.apk
