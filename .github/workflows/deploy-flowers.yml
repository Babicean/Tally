name: Deploy flowers page to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - public/flowers.html
      - wrangler.flowers.jsonc
      - .github/workflows/deploy-flowers.yml

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage site
        run: |
          mkdir -p .flowers-site
          cp public/flowers.html .flowers-site/index.html

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.flowers.jsonc
